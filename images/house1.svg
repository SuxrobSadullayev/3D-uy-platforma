<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bbdefb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6f00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e65100;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="400" height="300" fill="url(#grad1)"/>
  
  <!-- Ground -->
  <rect y="200" width="400" height="100" fill="#81c784"/>
  
  <!-- House body -->
  <rect x="80" y="120" width="240" height="120" fill="#d7ccc8" stroke="#795548" stroke-width="2"/>
  
  <!-- Roof -->
  <polygon points="80,120 200,30 320,120" fill="url(#grad2)" stroke="#e65100" stroke-width="2"/>
  
  <!-- Door -->
  <rect x="170" y="180" width="60" height="80" fill="#8d6e63" stroke="#654321" stroke-width="2"/>
  <circle cx="225" cy="220" r="4" fill="#ffd700"/>
  
  <!-- Windows -->
  <rect x="100" y="140" width="40" height="40" fill="#b3e5fc" stroke="#01579b" stroke-width="1"/>
  <line x1="120" y1="140" x2="120" y2="180" stroke="#01579b" stroke-width="1"/>
  <line x1="100" y1="160" x2="140" y2="160" stroke="#01579b" stroke-width="1"/>
  
  <rect x="260" y="140" width="40" height="40" fill="#b3e5fc" stroke="#01579b" stroke-width="1"/>
  <line x1="280" y1="140" x2="280" y2="180" stroke="#01579b" stroke-width="1"/>
  <line x1="260" y1="160" x2="300" y2="160" stroke="#01579b" stroke-width="1"/>
  
  <!-- Side window -->
  <rect x="120" y="155" width="30" height="30" fill="#b3e5fc" stroke="#01579b" stroke-width="1"/>
  <line x1="135" y1="155" x2="135" y2="185" stroke="#01579b" stroke-width="1"/>
  <line x1="120" y1="170" x2="150" y2="170" stroke="#01579b" stroke-width="1"/>
  
  <!-- Chimney -->
  <rect x="200" y="60" width="20" height="70" fill="#a1887f" stroke="#654321" stroke-width="1"/>
  
  <!-- Text -->
  <text x="200" y="270" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">1 XONALI UY</text>
  <text x="200" y="290" font-size="12" text-anchor="middle" fill="#666">45 m² • $35,000</text>
</svg>
