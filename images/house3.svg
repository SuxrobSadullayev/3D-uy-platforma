<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f2f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b2dfdb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00695c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00897b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="400" height="300" fill="url(#grad1)"/>
  
  <!-- Ground -->
  <rect y="200" width="400" height="100" fill="#558b2f"/>
  
  <!-- Main house body -->
  <rect x="50" y="60" width="300" height="160" fill="#ffe0b2" stroke="#e65100" stroke-width="2"/>
  
  <!-- Upper section (attic style) -->
  <rect x="70" y="40" width="260" height="30" fill="#ffe0b2" stroke="#e65100" stroke-width="1"/>
  
  <!-- Roof -->
  <polygon points="50,60 200,10 350,60" fill="url(#grad2)" stroke="#00897b" stroke-width="2"/>
  
  <!-- Central door (main) -->
  <rect x="165" y="160" width="70" height="80" fill="#6d4c41" stroke="#3e2723" stroke-width="2"/>
  <circle cx="225" cy="200" r="4" fill="#ffd700"/>
  
  <!-- Left side door -->
  <rect x="70" y="175" width="45" height="65" fill="#8d6e63" stroke="#654321" stroke-width="1.5"/>
  <circle cx="97.5" cy="207.5" r="3" fill="#ffd700"/>
  
  <!-- Right side door -->
  <rect x="285" y="175" width="45" height="65" fill="#8d6e63" stroke="#654321" stroke-width="1.5"/>
  <circle cx="312.5" cy="207.5" r="3" fill="#ffd700"/>
  
  <!-- Windows grid -->
  <!-- Row 1 -->
  <rect x="80" y="80" width="35" height="35" fill="#81d4fa" stroke="#0277bd" stroke-width="1"/>
  <line x1="97.5" y1="80" x2="97.5" y2="115" stroke="#0277bd" stroke-width="1"/>
  <line x1="80" y1="97.5" x2="115" y2="97.5" stroke="#0277bd" stroke-width="1"/>
  
  <rect x="145" y="80" width="35" height="35" fill="#81d4fa" stroke="#0277bd" stroke-width="1"/>
  <line x1="162.5" y1="80" x2="162.5" y2="115" stroke="#0277bd" stroke-width="1"/>
  <line x1="145" y1="97.5" x2="180" y2="97.5" stroke="#0277bd" stroke-width="1"/>
  
  <rect x="210" y="80" width="35" height="35" fill="#81d4fa" stroke="#0277bd" stroke-width="1"/>
  <line x1="227.5" y1="80" x2="227.5" y2="115" stroke="#0277bd" stroke-width="1"/>
  <line x1="210" y1="97.5" x2="245" y2="97.5" stroke="#0277bd" stroke-width="1"/>
  
  <rect x="275" y="80" width="35" height="35" fill="#81d4fa" stroke="#0277bd" stroke-width="1"/>
  <line x1="292.5" y1="80" x2="292.5" y2="115" stroke="#0277bd" stroke-width="1"/>
  <line x1="275" y1="97.5" x2="310" y2="97.5" stroke="#0277bd" stroke-width="1"/>
  
  <!-- Row 2 -->
  <rect x="80" y="130" width="35" height="35" fill="#81d4fa" stroke="#0277bd" stroke-width="1"/>
  <line x1="97.5" y1="130" x2="97.5" y2="165" stroke="#0277bd" stroke-width="1"/>
  <line x1="80" y1="147.5" x2="115" y2="147.5" stroke="#0277bd" stroke-width="1"/>
  
  <rect x="275" y="130" width="35" height="35" fill="#81d4fa" stroke="#0277bd" stroke-width="1"/>
  <line x1="292.5" y1="130" x2="292.5" y2="165" stroke="#0277bd" stroke-width="1"/>
  <line x1="275" y1="147.5" x2="310" y2="147.5" stroke="#0277bd" stroke-width="1"/>
  
  <!-- Chimneys -->
  <rect x="100" y="35" width="18" height="40" fill="#5d4037" stroke="#3e2723" stroke-width="1"/>
  <rect x="282" y="35" width="18" height="40" fill="#5d4037" stroke="#3e2723" stroke-width="1"/>
  
  <!-- Text -->
  <text x="200" y="270" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">3 XONALI UY</text>
  <text x="200" y="290" font-size="12" text-anchor="middle" fill="#666">95 m² • $75,000</text>
</svg>
